# Limine bootloader configuration.
#
# Why Limine exists in this repo at all: GRUB's Multiboot2 handoff goes
# through its "relocator" trampoline, which crashes on firmware that
# enforces W^X/NX on loader allocations - reproduced first on QEMU with
# new EDK2 (see the relocator.mod workaround in the Makefile), and then
# terminally on the ASUS PRIME H670-PLUS D4, where boot freezes at the
# instant of the handoff with no workaround available. Limine implements
# the same Multiboot2 protocol with firmware-clean memory handling, so
# the kernel itself needs no changes.
#
# Key syntax (Limine 12.x): entries start with a /name line; keys are
# `key: value`. `boot():` means "the volume this bootloader came from".

timeout: 5

/SecureOS
    protocol: multiboot2
    path: boot():/boot/secureos.elf
    module_path: boot():/boot/fat32.img
    module_string: fat32-ramdisk
