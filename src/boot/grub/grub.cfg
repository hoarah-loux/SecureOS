###############################################
# GRUB Configuration File (grub.cfg)
###############################################
#
# What this file is:
# - This is a configuration file for GRUB.
# - GRUB = GRand Unified Bootloader.
# - GRUB reads this file at boot time to populate its menu and decide what to
#   load/execute.
#
# What we use it for:
# - Load our kernel ELF image via the Multiboot2 protocol.
# - Keep graphics mode so the kernel can draw to the framebuffer.
# - The FAT32 image is attached separately as a QEMU disk, not a GRUB module.
#
# Terminology / abbreviations used below:
# - UEFI = Unified Extensible Firmware Interface (modern firmware interface).
# - QEMU = Quick Emulator (virtual machine used for testing).
# - ISO = ISO 9660 optical-disc filesystem image (what we boot as a virtual CD).
# - ELF = Executable and Linkable Format (Linux/Unix executable format).
# - Multiboot2 = standardized boot protocol used by GRUB to pass boot info.
# - Framebuffer = linear pixel buffer representing the screen.
#
# Note:
# - Lines beginning with '#' are comments and are ignored by GRUB.

# Choose which menu entry index boots by default.
# - Menu entries are numbered from 0.
# - 0 means the first menuentry declared in this file.
set default=0

# How many seconds GRUB waits before automatically booting the default entry.
# - If you press a key during the timeout, you can manually choose an entry.
set timeout=5

# ---------------- Graphics / console setup ----------------
# Under UEFI + QEMU, legacy VGA text output is not reliable. We still keep GRUB
# itself on the console, but we also want a graphics framebuffer mode for the
# kernel.

# Load GRUB's "all_video" module.
# - This enables a broad set of video drivers/output backends.
# - We use it so GRUB can set up a framebuffer mode that the kernel can reuse.
insmod all_video

# Configure GRUB's input device.
# - "console" means keyboard input via the firmware/console.
terminal_input console

# Configure GRUB's output device.
# - "console" means GRUB prints messages to its own console.
terminal_output console

# Request 1920x1080x32 first (what real desktop GOP firmware offers), then
# fall back to automatic selection when the platform lacks that mode.
# - The exact mode can vary by machine/firmware; the kernel reads the actual
#   geometry from the Multiboot2 framebuffer tag, never from this line.
set gfxmode=1920x1080x32,auto

# Keep (do not reset) the selected graphics mode when booting the OS.
# - "keep" is important: it preserves the framebuffer so Multiboot2 can pass
#   framebuffer information (tag type 8) to the kernel.
set gfxpayload=keep

# ---------------- Boot menu entries ----------------

# A GRUB menu entry named "SecureOS".
# - When selected, GRUB will load the kernel and transfer control to it.
menuentry "SecureOS" {
    # Load the kernel image using the Multiboot2 protocol.
    # - The path is relative to the root of the boot media.
    # - Our Makefile installs the kernel into /boot/secureos.elf in the ISO.
    # - GRUB will parse the Multiboot2 header inside the ELF and prepare the
    #   Multiboot2 information structure (boot info) for the kernel.
    multiboot2 /boot/secureos.elf

    # Load the FAT32 userland image into RAM as a Multiboot2 module.
    # - GRUB copies the file into memory and hands the kernel its physical
    #   address range via a module tag (type 3) with this cmdline string.
    # - The kernel mounts it as a RAM-backed block device, so no IDE/AHCI
    #   driver is needed to reach userland - this is the bare-metal path.
    module2 /boot/fat32.img fat32-ramdisk

    # Boot the currently loaded entry.
    # - This transfers control from GRUB to the kernel entry point.
    boot
}

# Optional fallback entry: open a GRUB interactive command environment.
# - Useful if you ever need to manually inspect devices, list files, or
#   experiment with commands.
menuentry "GRUB Command Line" {
    # Print a hint to the screen.
    echo "Type 'help' for commands"
}
